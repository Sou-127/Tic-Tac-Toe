<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tic Tac Toe</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #857272;
        }
        .container {
            text-align: center;
            position: relative;
        
        }
        .grid {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .row {
            display: flex;
            flex-direction: row;
        }
        .col {
            width: 100px;
            height: 100px;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .container > button {
           position: fixed;
           top: calc(50% + 200px);
           left: 50%;
              transform: translateX(-50%);
              padding: 10px 20px;
              font-size: 16px;
              cursor: pointer;
              background-color: #4d5358;
              color: white;
        }
        
        .popup {
            position: fixed;
            top: calc(50% - 230px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;

        }

        .popup-content {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid">
            <div class="row">
                <div onclick = "handleClick(this)" id = "0" class="col"></div>
                <div onclick = "handleClick(this)" id = "1" class="col"></div>
                <div onclick = "handleClick(this)" id = "2" class="col"></div>
            </div>
            <div class="row">
                <div onclick = "handleClick(this)" id = "3" class="col"></div>
                <div onclick = "handleClick(this)" id = "4" class="col"></div>
                <div onclick = "handleClick(this)" id = "5" class="col"></div>
            </div>
            <div class="row">
                <div onclick = "handleClick(this)" id = "6" class="col"></div>
                <div onclick = "handleClick(this)" id = "7" class="col"></div>
                <div onclick = "handleClick(this)" id = "8" class="col"></div>
            
            </div>
        </div>
        <div class="popup" id = "winnerpopup">
            <div class="popup-content">
                <h2 id = "winner"></h2>
        </div>
          </div>
        <button onclick = "restartGame()">Restart Game</button>
            
    </div>
    <script src="script.js"></script>
</body>
</html>
